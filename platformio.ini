#
# Project Configuration File

[platformio]
default_envs = esp32s3-cam

[version]
# Note: Dynamic build flags with shell commands don't work reliably on Windows
# Using static version info instead
build_flags = 
    -DPIO_SRC_REV=0
    -DPIO_BUILD_DATE=2025-12-23
    -DPIO_BUILD_TIME=00:00:00

[env:esp32s3-cam]
platform = espressif32
framework = arduino
board = esp32s3-cam
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.variants_dir = variants
build_flags = 
    ${version.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_CAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0

; Pinned library versions — added in Increment 0 setup (T003/T004).
; ESPAsyncWebServer + AsyncTCP: used from Increment 2 onward (camera streaming,
;   AsyncWebServer migration). esp32async forks are the actively-maintained
;   community versions, compatible with espressif32 platform 6.x.
; Micro-RTSP: used from Increment 2 onward (RTSP stream on port 554 for QGC).
lib_deps =
    esp32async/ESPAsyncWebServer@3.10.3
    esp32async/AsyncTCP@3.4.10
    geeksville/Micro-RTSP@0.1.6

monitor_speed = 115200

; OTA upload environment — builds identically to esp32s3-cam but uploads via
; HTTP POST to the device's /upload endpoint instead of USB serial.
; Set upload_port to the device's current IP address before running:
;   - AP mode (default): 192.168.4.1
;   - STA mode: check serial monitor at boot or your router's DHCP table
;     (device MAC: d0:cf:13:14:ef:78)
; Usage: pio run -e esp32s3-cam-ota --target upload
[env:esp32s3-cam-ota]
platform = espressif32
framework = arduino
board = esp32s3-cam
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.variants_dir = variants
build_flags =
    ${version.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_CAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    esp32async/ESPAsyncWebServer@3.10.3
    esp32async/AsyncTCP@3.4.10
    geeksville/Micro-RTSP@0.1.6
upload_protocol = custom
upload_port = 192.168.1.119
extra_scripts = upload_ota.py