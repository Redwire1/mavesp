#
# Project Configuration File
#
# A detailed documentation with the EXAMPLES is located here:
# http://docs.platformio.org/en/latest/projectconf.html
#

# A sign `#` at the beginning of the line indicates a comment
# Comment lines are ignored.

# Simple and base environment
# [env:mybaseenv]
# platform = %INSTALLED_PLATFORM_NAME_HERE%
# framework =
# board =
#
# Automatic targets - enable auto-uploading
# targets = upload

# The upload speed below (921600) has worked fine for all modules I tested. If you have upload issues,
# try reducing to 115200.

[platformio]
default_envs = esp32s3-cam

[version]
# Note: Dynamic build flags with shell commands don't work reliably on Windows
# Using static version info instead
build_flags = 
    -DPIO_SRC_REV=0
    -DPIO_BUILD_DATE=2025-12-23
    -DPIO_BUILD_TIME=00:00:00

[env:esp12e]
platform = espressif8266@2.0.4
framework = arduino
board = esp12e
build_flags = ${version.build_flags} -Wl,-Tesp8266.flash.4m.ld -DPIO_BOARD=esp12e

[env:esp01_1m]
platform = espressif8266@2.0.4
framework = arduino
board = esp01_1m
build_flags = ${version.build_flags} -DPIO_BOARD=esp01_1m

[env:esp01]
platform = espressif8266@2.0.4
framework = arduino
board = esp01
build_flags = ${version.build_flags} -DPIO_BOARD=esp01

[env:esp32s3-cam]
platform = espressif32
framework = arduino
board = esp32s3-cam
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.variants_dir = variants
build_flags = 
    ${version.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_CAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0

; Pinned library versions — added in Increment 0 setup (T003/T004).
; ESPAsyncWebServer + AsyncTCP: used from Increment 2 onward (camera streaming,
;   AsyncWebServer migration). esp32async forks are the actively-maintained
;   community versions, compatible with espressif32 platform 6.x.
; Micro-RTSP: used from Increment 2 onward (RTSP stream on port 554 for QGC).
lib_deps =
    esp32async/ESPAsyncWebServer@3.10.3
    esp32async/AsyncTCP@3.4.10
    geeksville/Micro-RTSP@0.1.6

monitor_speed = 115200